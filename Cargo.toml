[package]
name = "accessibility"
version = "26.1"
edition = "2021"
description = "Rust i18n library for embedding in TontooOS"
license = "TCL"
repository = "https://github.com/TontooOS/Accessibility"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

