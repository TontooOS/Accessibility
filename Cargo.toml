[package]
name = "accessibility"
version = "26.1.0"
edition = "2021"
description = "Rust i18n library for embedding in TontooOS"
license = "TCL"
repository = "https://github.com/TontooOS/Accessibility"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# serde derive is still required: Foundation's JSONSerialization API is generic
# over Serialize/DeserializeOwned, so LangFile must derive them.
# serde_json + once_cell are replaced (Foundation API + std OnceLock).
serde = { version = "1.0", features = ["derive"] }
foundation = { path = "../Foundation" }

